global:
  scrape_interval: 15s

scrape_configs:
  - job_name: coreapi
    static_configs:
      - targets: ["coreapi:8080"]

  - job_name: authservice
    static_configs:
      - targets: ["authservice:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: mongodb
    static_configs:
      - targets: ["mongodb-exporter:9216"]
