services:
  mongodb:
    image: mongo:9.0
    container_name: IS_IotMonitoring_Mongodb
    ports:
      - 27018:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongo_data:/data/db

  postgresql:
    image: postgres:18
    container_name: IS_IotMonitoring_PostgreSQL
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgresql_backend
    volumes:
      - pgdata:/var/lib/postgresql

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:postgres@postgresql:5432/postgres?sslmode=disable
    depends_on: [postgresql]

  mongodb-exporter:
    image: percona/mongodb_exporter:0.44.0
    command: ["--mongodb.uri=mongodb://admin:admin@mongodb:27017", "--collect-all", "--compatible-mode"]
    depends_on: [mongodb]

  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts: ["host.docker.internal:host-gateway"]

  loki:
    image: grafana/loki:3.5.3
    ports: ["3100:3100"]
    command: -config.file=/etc/loki/local-config.yaml

  tempo:
    image: grafana/tempo:2.8.1
    command: ["-config.file=/etc/tempo.yaml"]
    ports: ["3200:3200", "4317:4317"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo.yaml:ro

  grafana:
    image: grafana/grafana:12.1.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus, loki, tempo]

volumes:
  pgdata:
  mongo_data:
  prometheus_data:
  grafana_data: